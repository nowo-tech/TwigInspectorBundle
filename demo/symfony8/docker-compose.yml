name: twig-inspector-bundle-demo-symfony-8
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twig-inspector-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8001}:80"
    volumes:
      - .:/app
      # Mount bundle root so the path repo symlink works and template/code changes are visible
      - ../..:/var/twig-inspector-bundle
      - composer-cache:/root/.composer/cache
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      - APP_ENV=dev
    networks:
      - twig-inspector-demo-network

volumes:
  composer-cache:
    driver: local

networks:
  twig-inspector-demo-network:
    driver: bridge
