checks:
  php:
    code_rating: true
    duplication: true

filter:
  excluded_paths:
    - "demo/*"
    - "tests/*"
    - "vendor/*"
    - "node_modules/*"

build:
  environment:
    php:
      version: 8.2
      ini:
        memory_limit: -1
        # PHPUnit needs a coverage driver: Xdebug 3 must run in coverage mode, or use PCOV (see GitHub CI).
        'xdebug.mode': coverage
    node:
      # pnpm@10.x requires Node >= 18.12 and the bundle uses Node 20 types/DOM/tooling.
      version: 20

  cache:
    directories:
      - vendor/

  tests:
    before:
      - composer validate --strict
      - composer install --no-interaction --prefer-dist --optimize-autoloader
      # Frontend CI uses pnpm (see package.json "packageManager").
      # Ensure the expected pnpm version exists on the worker.
      - corepack enable
      - corepack prepare pnpm@10.29.2 --activate
    override:
      # Same as local / GitHub `composer test-coverage`; clover must exist for Scrutinizer.
      - command: composer test-coverage
        environment:
          XDEBUG_MODE: coverage
        coverage:
          file: coverage.xml
          format: clover
      # Frontend (Vitest). Reference: REQ-CI-002 in BUNDLES_FULL_SPECS_DETAILS.md
      - command: pnpm install --frozen-lockfile && pnpm run test
